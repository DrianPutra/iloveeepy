<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #fff5f7;
  font-family: 'Lato', sans-serif;
  overflow-x: hidden;
}

/* ── PETALS ── */
.petal {
  position: fixed;
  border-radius: 50% 0 50% 0;
  pointer-events: none;
  z-index: 0;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0%   { transform: translateY(-30px) rotate(0deg) translateX(0px);    opacity: 0.55; }
  50%  { transform: translateY(50vh)  rotate(180deg) translateX(20px);  opacity: 0.4;  }
  100% { transform: translateY(108vh) rotate(360deg) translateX(-10px); opacity: 0;    }
}

/* ── PAGES — block layout, no overlap ── */
#landing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 2rem;
  position: relative;
  z-index: 1;
}

#bouquet-page {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2.5rem 1.5rem 3rem;
  position: relative;
  z-index: 1;
}
#bouquet-page.active {
  display: flex;
  animation: pageReveal 0.9s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes pageReveal {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── LANDING CONTENT ── */
.landing-inner {
  animation: floatUp 1.1s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes floatUp {
  from { opacity: 0; transform: translateY(36px); }
  to   { opacity: 1; transform: translateY(0); }
}

.blossom-icon {
  font-size: 3rem;
  display: block;
  margin-bottom: 1.4rem;
  animation: bloomPulse 2.4s ease-in-out infinite;
}
@keyframes bloomPulse {
  0%, 100% { transform: scale(1) rotate(-3deg); }
  50%       { transform: scale(1.18) rotate(3deg); }
}

.eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #b5697a;
  margin-bottom: 0.9rem;
}

.headline {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 7vw, 4rem);
  color: #2e1520;
  line-height: 1.2;
  margin-bottom: 0.4rem;
}
.headline em { font-style: italic; color: #b5485a; }

.subline {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: #8a5060;
  margin-bottom: 3rem;
}

.btn-open {
  position: relative;
  overflow: hidden;
  background: transparent;
  border: 1.5px solid #b5485a;
  color: #b5485a;
  font-family: 'Lato', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  padding: 0.95rem 3.2rem;
  border-radius: 50px;
  cursor: pointer;
  transition: color 0.35s;
  z-index: 2;
}
.btn-open::before {
  content: '';
  position: absolute;
  inset: 0;
  background: #b5485a;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.35s ease;
  z-index: -1;
}
.btn-open:hover { color: #fff; }
.btn-open:hover::before { transform: scaleX(1); }
.btn-open:active { transform: scale(0.97); }

/* ── BOUQUET CONTAINER ── */
.bouquet-container {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.bouquet-img {
  width: min(420px, 88vw);
  height: auto;
  display: block;
  filter: drop-shadow(0 20px 44px rgba(180,72,90,0.22));
  animation: gentleFloat 5s ease-in-out infinite;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
@keyframes gentleFloat {
  0%, 100% { transform: translateY(0);   }
  50%       { transform: translateY(-8px); }
}

/* ── ENVELOPES ── */
.env-btn {
  position: absolute;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  z-index: 10;
  width: 62px;
  height: 50px;
  transition: filter 0.2s;
}
.env-btn svg { width: 100%; height: 100%; }

.env-1 { top: 6%;    left: -8%;   animation: envFloat1 2.8s ease-in-out infinite; }
.env-2 { top: 16%;   right: -9%;  animation: envFloat2 3.2s ease-in-out 0.4s infinite; }
.env-3 { bottom: 18%; left: 0%;   animation: envFloat3 3s   ease-in-out 0.8s infinite; }

@keyframes envFloat1 {
  0%, 100% { transform: rotate(-12deg) translateY(0);    }
  50%       { transform: rotate(-12deg) translateY(-7px); }
}
@keyframes envFloat2 {
  0%, 100% { transform: rotate(10deg) translateY(0);    }
  50%       { transform: rotate(10deg) translateY(-7px); }
}
@keyframes envFloat3 {
  0%, 100% { transform: rotate(-8deg) translateY(0);    }
  50%       { transform: rotate(-8deg) translateY(-7px); }
}
.env-btn:hover {
  animation: none !important;
  filter: drop-shadow(0 6px 14px rgba(180,72,90,0.45));
  transform: scale(1.2) rotate(-5deg) !important;
}

/* ── DOWNLOAD ── */
.btn-download {
  margin-top: 2.4rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: transparent;
  border: 1.5px solid #b5485a;
  color: #b5485a;
  font-family: 'Lato', sans-serif;
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  padding: 0.8rem 2.4rem;
  border-radius: 50px;
  cursor: pointer;
  transition: background 0.3s, color 0.3s, transform 0.15s;
}
.btn-download:hover { background: #b5485a; color: #fff; }
.btn-download:active { transform: scale(0.97); }

/* ── MODAL ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(40,10,22,0.6);
  backdrop-filter: blur(5px);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.modal-bg.open {
  display: flex;
  animation: modalIn 0.3s ease both;
}
@keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }

.letter-card {
  background: #fffaf8;
  border-radius: 20px;
  max-width: 500px;
  width: 100%;
  padding: 2.8rem 2.5rem 2.2rem;
  position: relative;
  box-shadow: 0 40px 80px rgba(40,10,22,0.3);
  border-top: 4px solid #b5485a;
  animation: cardPop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes cardPop {
  from { opacity: 0; transform: scale(0.82) translateY(28px); }
  to   { opacity: 1; transform: scale(1)    translateY(0); }
}

.wax-seal {
  position: absolute;
  top: -22px; right: 32px;
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #d43050, #a02040);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  box-shadow: 0 4px 16px rgba(180,40,70,0.45);
  border: 2px solid #f9c0cc;
}

.letter-date {
  font-size: 0.68rem;
  letter-spacing: 0.22em;
  color: #b5697a;
  text-transform: uppercase;
  margin-bottom: 1.2rem;
}
.letter-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  color: #2e1520;
  font-weight: 700;
  margin-bottom: 1rem;
}
.letter-body {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 0.98rem;
  color: #3d2030;
  line-height: 1.95;
  white-space: pre-line;
}
.letter-sign {
  margin-top: 1.6rem;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1rem;
  color: #b5485a;
  text-align: right;
}

.btn-close {
  position: absolute;
  top: 14px; left: 18px;
  background: none;
  border: none;
  font-size: 1.1rem;
  color: #b5697a;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  line-height: 1;
  transition: background 0.2s, color 0.2s;
}
.btn-close:hover { background: #f9e0e8; color: #3d2030; }

/* ── CONFETTI ── */
.conf {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  animation: confDrop 1.6s ease-out forwards;
}
@keyframes confDrop {
  0%   { opacity: 1; transform: translateY(0)    rotate(0deg)   scale(1);   }
  100% { opacity: 0; transform: translateY(240px) rotate(800deg) scale(0.2); }
}
</style>
</head>
<body>

<!-- petals -->
<div id="petals" style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;"></div>

<!-- ══ LANDING ══ -->
<section id="landing">
  <div class="landing-inner">
    <span class="blossom-icon">🌸</span>
    <p class="eyebrow">Untuk kamu</p>
    <h1 class="headline">Halo <em>sayangku</em>,</h1>
    <p class="subline">I have something for you</p>
    <button class="btn-open" onclick="showBouquet(event)">Open &nbsp;✦</button>
  </div>
</section>

<!-- ══ BOUQUET PAGE ══ -->
<section id="bouquet-page">

  <div class="bouquet-container">

    <img
      id="bouquet-img"
      class="bouquet-img"
      src="flowers.png"
      alt="Bouquet bunga"
      crossorigin="anonymous"
          />

    <!-- Envelope 1 – kiri atas -->
    <button class="env-btn env-1" onclick="openLetter(0,event)" title="Surat 1">
      <svg viewBox="0 0 58 46" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="56" height="44" rx="6" fill="#fff0f5" stroke="#d4607a" stroke-width="1.8"/>
        <polyline points="1,2 29,27 57,2" fill="none" stroke="#d4607a" stroke-width="1.8"/>
        <line x1="1" y1="45" x2="21" y2="23" stroke="#d4607a" stroke-width="1.2"/>
        <line x1="57" y1="45" x2="37" y2="23" stroke="#d4607a" stroke-width="1.2"/>
        <circle cx="29" cy="27" r="5" fill="#f4a0b8"/>
      </svg>
    </button>

    <!-- Envelope 2 – kanan atas -->
    <button class="env-btn env-2" onclick="openLetter(1,event)" title="Surat 2">
      <svg viewBox="0 0 58 46" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="56" height="44" rx="6" fill="#fff0f5" stroke="#a03060" stroke-width="1.8"/>
        <polyline points="1,2 29,27 57,2" fill="none" stroke="#a03060" stroke-width="1.8"/>
        <line x1="1" y1="45" x2="21" y2="23" stroke="#a03060" stroke-width="1.2"/>
        <line x1="57" y1="45" x2="37" y2="23" stroke="#a03060" stroke-width="1.2"/>
        <circle cx="29" cy="27" r="5" fill="#e878a0"/>
      </svg>
    </button>

    <!-- Envelope 3 – kiri bawah -->
    <button class="env-btn env-3" onclick="openLetter(2,event)" title="Surat 3">
      <svg viewBox="0 0 58 46" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="56" height="44" rx="6" fill="#fff0f5" stroke="#c04070" stroke-width="1.8"/>
        <polyline points="1,2 29,27 57,2" fill="none" stroke="#c04070" stroke-width="1.8"/>
        <line x1="1" y1="45" x2="21" y2="23" stroke="#c04070" stroke-width="1.2"/>
        <line x1="57" y1="45" x2="37" y2="23" stroke="#c04070" stroke-width="1.2"/>
        <circle cx="29" cy="27" r="5" fill="#f4b0c8"/>
      </svg>
    </button>

  </div>

  <button class="btn-download" onclick="downloadBouquet()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download Bouquet
  </button>

</section>

<!-- ══ MODAL ══ -->
<div class="modal-bg" id="modal" onclick="onOverlayClick(event)">
  <div class="letter-card">
    <button class="btn-close" onclick="closeLetter()">✕</button>
    <div class="wax-seal">💌</div>
    <p class="letter-date"  id="letter-date"></p>
    <h2 class="letter-title" id="letter-title"></h2>
    <div class="letter-body" id="letter-body"></div>
    <p class="letter-sign"  id="letter-sign"></p>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   ✏️  EDIT ISI SURAT DI SINI
   Ganti teks di antara backtick ` ... `
══════════════════════════════════════════════ */
const letters = [
  {
    title: "Untuk kamu, sayangku 🌸",
    body:
`Hai sayang,

Tulis isi surat pertamamu di sini.
Ganti teks ini dengan kata-kata dari hatimu. 💕`,
    sign: "Selalu mencintaimu 🌹"
  },
  {
    title: "Kamu adalah segalanya 💕",
    body:
`Sayang,

Tulis isi surat keduamu di sini.
Ungkapkan perasaanmu yang paling dalam. 🌷`,
    sign: "Milikmu sepenuhnya 💖"
  },
  {
    title: "Surprise untukmu! 🎀",
    body:
`Hey kamu,

Tulis isi surat ketigamu di sini.
Buat dia tersenyum dan terharu. 🌺`,
    sign: "Dengan sepenuh hati 🫶"
  }
];
/* ══════════════════════════════════════════════ */

/* petals */
const petalColors = ['#f9c0cc','#f4a0b8','#fdd4e0','#e8a8b8','#fce0e8'];
const pw = document.getElementById('petals');
for (let i = 0; i < 24; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  const s = 8 + Math.random() * 10;
  p.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s*1.3}px;background:${petalColors[Math.floor(Math.random()*petalColors.length)]};animation-duration:${7+Math.random()*9}s;animation-delay:${Math.random()*10}s;`;
  pw.appendChild(p);
}

/* page switch */
function showBouquet(e) {
  spawnConfetti(e.clientX, e.clientY, 30);
  document.getElementById('landing').style.display = 'none';
  document.getElementById('bouquet-page').classList.add('active');
}

/* letter */
function openLetter(idx, e) {
  if (e) { e.stopPropagation(); spawnConfetti(e.clientX, e.clientY, 22); }
  const l = letters[idx];
  document.getElementById('letter-date').textContent =
    new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('letter-title').textContent = l.title;
  document.getElementById('letter-body').textContent  = l.body;
  document.getElementById('letter-sign').textContent  = l.sign;
  document.getElementById('modal').classList.add('open');
}
function closeLetter() { document.getElementById('modal').classList.remove('open'); }
function onOverlayClick(e) { if (e.target===document.getElementById('modal')) closeLetter(); }

/* confetti */
function spawnConfetti(cx, cy, n) {
  const colors=['#f43060','#f89ab0','#ffd0e0','#a04070','#ffb8cc'];
  for (let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='conf';
    const sz=6+Math.random()*9;
    c.style.cssText=`left:${cx+(Math.random()-.5)*150}px;top:${cy+(Math.random()-.5)*90}px;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-delay:${Math.random()*.4}s;border-radius:${Math.random()>.4?'50%':'3px'};`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2200);
  }
}

/* download */
function downloadBouquet() {
  const img = document.getElementById('bouquet-img');
  const canvas = document.createElement('canvas');
  const pad = 60;
  canvas.width  = img.naturalWidth  + pad*2;
  canvas.height = img.naturalHeight + pad*2 + 50;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff5f7';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img, pad, pad, img.naturalWidth, img.naturalHeight);
  ctx.font = 'italic 20px Georgia,serif';
  ctx.fillStyle = '#c47f9a';
  ctx.textAlign = 'center';
  ctx.fillText('🌹 For You, My Love 🌹', canvas.width/2, canvas.height-18);
  try {
    const a = document.createElement('a');
    a.download = 'bouquet-for-you.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch(err) {
    alert('Buka file lewat VS Code Live Server untuk fitur download, atau klik kanan gambar → Save Image As.');
  }
}
</script>
</body>
</html>
